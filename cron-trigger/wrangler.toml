name = "ko-cron-trigger"
main = "ko-cron-trigger.js"
compatibility_date = "2026-07-10"

[triggers]
# Identisch zum GitHub-Cron (03:37 UTC, Mo-Sa) — als zuverlässiger Zweit-Trigger.
# GitHub Actions' eigener Scheduler läuft "Best Effort" und kann Läufe
# ersatzlos ausfallen lassen (siehe 09./10.07.2026). Cloudflare Cron Triggers
# sind für genau diesen Zweck gebaut und laufen deutlich verlässlicher.
crons = ["37 3 * * 1-6"]
